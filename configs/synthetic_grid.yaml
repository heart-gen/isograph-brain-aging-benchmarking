seed_count_core: 20
seed_count_main_figure: 30
seed_count_scale: 15
base_seed: 13
# isograph_vae_residual is listed for the UNCONFOUNDED scenarios as the intended cost
# control for the gap #6 ablation. Residualization repairs the merging failure mode on
# confounded data (cell_composition ARI 0.185 -> 0.643, library_depth 0.116 -> 0.647), but
# regressing out covariates removes real signal whenever signal and covariate are
# correlated, so "residualization fixes the confound losses" is only supportable alongside
# evidence that it costs nothing when there is no confound to remove.
#
# THAT ABLATION IS NOT RUN FROM THIS GRID. Of the 1,980 isograph_vae_residual rows here,
# 488 have completed (the four confound scenarios, rna_degradation_coupled, and 88 of the
# 400 abundance_switch_mixed rows) and 1,492 are pending. Those 1,492 split into two groups
# that must NOT be treated the same way:
#
#   1,180 rows on the UNCONFOUNDED switch scenarios (idealized_switching 360, noise_stress
#   320, feature_space_interactions 300, unequal_isoform_abundance 80,
#   non_switching_background 80, negative_control_noise 40). DO NOT RUN THESE. Two reasons:
#     a. Residualization would be a SILENT NO-OP. Their cached samples.parquet predates the
#        RIN/neuron_frac/batch/library_size columns, so build_design_matrix receives nothing
#        and isograph_vae_residual reduces to isograph_vae -- the ablation would report
#        "costs exactly nothing" as an artifact of never having run.
#     b. The sample tables cannot be repaired. 1,204 cached datasets -- every core switch
#        scenario -- no longer regenerate from the current generator, so their covariates
#        cannot be backfilled without replacing the expression data every published number
#        was computed on. See benchmark/01_synthetic/_m/SAMPLE_TABLE_REFRESH.md.
#
#   312 rows on abundance_switch_mixed. These ARE runnable and are simply unfinished: all
#   400 of those datasets reproduced exactly and had their sample tables refreshed, so
#   residualization is a real operation on them. They are a genuine coverage gap in the
#   multiplex feature space, not a deliberate omission.
#
# The cost question is answered instead by a self-contained paired ablation on FRESH,
# generator-pinned datasets: configs/residual_cost_ablation.yaml ->
# isograph_benchmark/benchmark/residual_cost.py -> benchmark/03_metrics/_m/RESIDUAL_COST.md.
# Note its scope: in unconfounded scenarios RIN, neuron_frac and batch are constants that
# build_design_matrix drops, so what is measured is the cost of residualizing LIBRARY DEPTH
# ONLY -- not residualization in general.
methods:
  - isograph_vae
  - isograph_vae_gpu
  - isograph_vae_multiplex
  - isograph_vae_residual
  - isograph_latent
  - isograph_graph
  - isograph_baseline
  - isograph_spearman_leiden
  - wgcna_gene
multiplex_methods:
  - isograph_vae
  - isograph_vae_multiplex
  - isograph_vae_residual
  - wgcna_gene
scale_methods:
  - isograph_vae
  - isograph_vae_gpu
  - wgcna_gene
# Gap #6 confound scenarios run the WITH/WITHOUT residualization ablation plus the
# WGCNA comparator. isograph_vae = no residualization; isograph_vae_residual =
# residualizes the recorded nuisance covariates.
confound_methods:
  - isograph_vae
  - isograph_vae_residual
  - wgcna_gene
# Approach #3: the coupled-degradation scenario adds the abundance-channel methods
# (multiplex, and multiplex+reliability) because reliability weighting only helps
# once an abundance fallback path exists. isograph_vae (single channel) and
# isograph_vae_residual (RIN regression) are kept as the negative controls.
degradation_methods:
  - isograph_vae
  - isograph_vae_residual
  - isograph_vae_multiplex
  - isograph_vae_reliability
  - wgcna_gene
# Interpretation-accuracy scenario uses multi-isoform genes so the built-in switch
# interpretation must identify WHICH transcript drives the switch (degenerate at 2
# isoforms). Only the isograph methods that stage 03 interprets are run.
interpret_methods:
  - isograph_vae
  - isograph_vae_multiplex
# A1 genetic-anchoring scenario: contrast the promoted VAE method + its multiplex
# (switch+abundance) variant against the two matched network baselines on the IDENTICAL
# features -- Spearman+Leiden (same clustering, no VAE denoising) and classical WGCNA
# (correlation network). The claim under test: only the VAE recovers the planted
# cis-variant->module anchoring, because it recovers the co-switching module the
# eigengene mQTL rides on.
genetic_methods:
  - isograph_vae
  - isograph_vae_multiplex
  - isograph_spearman_leiden
  - wgcna_gene
scenarios:
  idealized_switching:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.10, 0.25, 0.50, 0.75]
    noise_sd: [0.10, 0.25, 0.40]
    seed_count: 30
  unequal_isoform_abundance:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    abundance_imbalance: [1, 4, 10, 25]
    noise_sd: [0.20]
  non_switching_background:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.05, 0.10, 0.25, 0.50]
    noise_sd: [0.25]
  noise_stress:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    count_dispersion: [3, 7, 15, 30]
    noise_sd: [0.05, 0.10, 0.25, 0.50]
  feature_space_interactions:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    interaction_strength: [0.0, 0.5, 1.0, 2.0, 3.0]
    interaction_fraction: [0.25, 0.50, 0.75]
    noise_sd: [0.25]
  abundance_switch_mixed:
    n_genes: [200, 500]
    n_samples: [100, 200]
    switching_fraction: [0.25]
    abundance_fraction: [0.0, 0.3, 0.5, 0.7, 1.0]
    noise_sd: [0.25]
    seed_count: 20
  negative_control_noise:
    # Pure noise: switching_fraction=0 ensures no true module signal.
    # Verifies that methods produce ~0 module recovery under null conditions.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.0]
    noise_sd: [0.5, 1.0]
  rna_degradation:
    # Gap #6: RIN-like 3' coverage bias distorts isoform ratios (the switching signal).
    # 0.0 is the matched in-scenario clean baseline; strength rises across the sweep.
    # abundance_fraction=0 (pure switch modules) -> no abundance channel to fall back
    # to, so this scenario shows the domain-of-validity limit, not the fallback.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    degradation_3p_bias: [0.0, 0.5, 1.0, 2.0]
    seed_count: 20
  rna_degradation_coupled:
    # Approach #3: degraded switch signal WITH a degradation-robust abundance channel
    # to fall back on. Module genes are part switch-driven, part abundance-driven, and
    # half the switch-driven genes are dual-signal (carry abundance for the same module).
    # The generator records median_tin (observed 3' coverage) as a sharper degradation
    # covariate than RIN; isograph_vae_reliability uses it to downweight corrupted
    # switch edges so dual-signal genes hold the module via abundance. Verified: this
    # helps only with the abundance channel enabled (multiplex), never at bias=0.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    abundance_fraction: [0.4]
    dual_signal_fraction: [0.5]
    noise_sd: [0.25]
    degradation_3p_bias: [0.0, 0.5, 1.0, 2.0]
    seed_count: 20
  multi_isoform_switch:
    # Interpretation-accuracy benchmark: genes have 4 isoforms, so the built-in
    # switch interpretation must pick the true switch-driver transcript (T1) out of
    # 4 (chance = 25%), not just confirm a binary flip. truth_switch_event records
    # the driver transcript + true delta-PSI; metrics switch_transcript_top1_accuracy
    # and switch_magnitude_spearman score the interpretation against them. Sweeps
    # noise so accuracy can be reported vs switch SNR. n_transcripts_per_gene is part
    # of the dataset hash, so these are fresh datasets (no existing IDs touched).
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.10, 0.25]
    n_transcripts_per_gene: [4]
    seed_count: 20
  cell_composition:
    # Gap #6: neuron/glia mixture proportions vary between samples (cv of neuron_frac).
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    cell_composition_cv: [0.0, 0.1, 0.2, 0.3]
    seed_count: 20
  batch_effects:
    # Gap #6: technical processing-batch structure (per-gene, per-batch offsets).
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    batch_effect_sd: [0.0, 0.25, 0.5, 1.0]
    seed_count: 20
  library_depth:
    # Gap #6: per-sample sequencing-depth variation (cv of log library size).
    # 0.25 matches the default depth spread, so it is the in-scenario clean baseline.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    library_depth_cv: [0.25, 0.5, 0.75, 1.0]
    seed_count: 20
  genetic_anchoring:
    # A1: ground-truth genetics. Each co-switching module carries one planted cis-variant
    # whose dosage shifts the module's SWITCH latent (per-allele = genetic_effect), plus an
    # equal number of unlinked NULL variants. The effect is modest, so the genotype->PSI
    # signal is only recoverable by pooling the module's genes into an eigengene mQTL --
    # i.e. only AFTER the co-switching module is recovered. Metrics: genetic_anchor_recall
    # (anchored variants recovered), genetic_anchor_fpr (null variants spuriously recovered),
    # genetic_anchor_best_r2_mean (graded), alongside module_recovery. Switch-driven modules
    # (abundance_fraction unset=0); noise sweep spans the regime where VAE denoising separates
    # from correlation networks. genetic_effect sweep gives a dose-response.
    n_genes: [400]
    n_samples: [200]
    switching_fraction: [0.25]
    noise_sd: [0.25, 0.40]
    genetic_effect: [0.5, 1.0, 2.0]
    genetic_module_fraction: [1.0]
    genetic_maf: [0.30]
    seed_count: 20
  scale:
    n_genes: [1000, 3000, 6000, 12000]
    n_samples: [240]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
  scale_realistic:
    # BrainSEQ-scale validation: ~17k genes x 300 samples matches real data dimensions.
    # Separate from "scale" to preserve existing run hashes while adding the
    # larger point needed for Nature Methods reviewers.
    n_genes: [16000]
    n_samples: [300]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  paired_tests: true
  fdr_method: benjamini-hochberg
