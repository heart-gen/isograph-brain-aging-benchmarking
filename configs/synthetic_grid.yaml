seed_count_core: 20
seed_count_main_figure: 30
seed_count_scale: 15
base_seed: 13
methods:
  - isograph_vae
  - isograph_vae_gpu
  - isograph_vae_multiplex
  - isograph_latent
  - isograph_graph
  - isograph_baseline
  - isograph_spearman_leiden
  - wgcna_gene
multiplex_methods:
  - isograph_vae
  - isograph_vae_multiplex
  - wgcna_gene
scale_methods:
  - isograph_vae
  - isograph_vae_gpu
  - wgcna_gene
# Gap #6 confound scenarios run the WITH/WITHOUT residualization ablation plus the
# WGCNA comparator. isograph_vae = no residualization; isograph_vae_residual =
# residualizes the recorded nuisance covariates.
confound_methods:
  - isograph_vae
  - isograph_vae_residual
  - wgcna_gene
scenarios:
  idealized_switching:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.10, 0.25, 0.50, 0.75]
    noise_sd: [0.10, 0.25, 0.40]
    seed_count: 30
  unequal_isoform_abundance:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    abundance_imbalance: [1, 4, 10, 25]
    noise_sd: [0.20]
  non_switching_background:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.05, 0.10, 0.25, 0.50]
    noise_sd: [0.25]
  noise_stress:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    count_dispersion: [3, 7, 15, 30]
    noise_sd: [0.05, 0.10, 0.25, 0.50]
  feature_space_interactions:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    interaction_strength: [0.0, 0.5, 1.0, 2.0, 3.0]
    interaction_fraction: [0.25, 0.50, 0.75]
    noise_sd: [0.25]
  abundance_switch_mixed:
    n_genes: [200, 500]
    n_samples: [100, 200]
    switching_fraction: [0.25]
    abundance_fraction: [0.0, 0.3, 0.5, 0.7, 1.0]
    noise_sd: [0.25]
    seed_count: 20
  negative_control_noise:
    # Pure noise: switching_fraction=0 ensures no true module signal.
    # Verifies that methods produce ~0 module recovery under null conditions.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.0]
    noise_sd: [0.5, 1.0]
  rna_degradation:
    # Gap #6: RIN-like 3' coverage bias distorts isoform ratios (the switching signal).
    # 0.0 is the matched in-scenario clean baseline; strength rises across the sweep.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    degradation_3p_bias: [0.0, 0.5, 1.0, 2.0]
    seed_count: 20
  cell_composition:
    # Gap #6: neuron/glia mixture proportions vary between samples (cv of neuron_frac).
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    cell_composition_cv: [0.0, 0.1, 0.2, 0.3]
    seed_count: 20
  batch_effects:
    # Gap #6: technical processing-batch structure (per-gene, per-batch offsets).
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    batch_effect_sd: [0.0, 0.25, 0.5, 1.0]
    seed_count: 20
  library_depth:
    # Gap #6: per-sample sequencing-depth variation (cv of log library size).
    # 0.25 matches the default depth spread, so it is the in-scenario clean baseline.
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    noise_sd: [0.25]
    library_depth_cv: [0.25, 0.5, 0.75, 1.0]
    seed_count: 20
  scale:
    n_genes: [1000, 3000, 6000, 12000]
    n_samples: [240]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
  scale_realistic:
    # BrainSEQ-scale validation: ~17k genes x 300 samples matches real data dimensions.
    # Separate from "scale" to preserve existing run hashes while adding the
    # larger point needed for Nature Methods reviewers.
    n_genes: [16000]
    n_samples: [300]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  paired_tests: true
  fdr_method: benjamini-hochberg
