seed_count_core: 20
seed_count_main_figure: 30
seed_count_scale: 8
base_seed: 13
methods:
  - isograph_vae
  - isograph_gpu_latent
  - isograph_latent
  - isograph_graph
  - isograph_baseline
  - wgcna_gene
scale_methods:
  - isograph_vae
  - isograph_gpu_latent
  - wgcna_gene
scenarios:
  idealized_switching:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.10, 0.25, 0.50, 0.75]
    noise_sd: [0.10, 0.25, 0.40]
    seed_count: 30
  unequal_isoform_abundance:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    abundance_imbalance: [1, 4, 10, 25]
    noise_sd: [0.20]
  non_switching_background:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.05, 0.10, 0.25, 0.50]
    noise_sd: [0.25]
  noise_stress:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    count_dispersion: [3, 7, 15, 30]
    noise_sd: [0.05, 0.10, 0.25, 0.50]
  feature_space_interactions:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    interaction_strength: [0.0, 0.5, 1.0, 2.0, 3.0]
    interaction_fraction: [0.25, 0.50, 0.75]
    noise_sd: [0.25]
  scale:
    n_genes: [1000, 3000, 6000, 12000]
    n_samples: [240]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  paired_tests: true
  fdr_method: benjamini-hochberg
