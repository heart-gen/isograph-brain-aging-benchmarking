seed_count_core: 20
seed_count_main_figure: 30
seed_count_scale: 15
base_seed: 13
methods:
  - isograph_vae
  - isograph_vae_multiplex
  - isograph_cpu_latent
  - isograph_latent
  - isograph_graph
  - isograph_baseline
  - wgcna_gene
multiplex_methods:
  - isograph_vae
  - isograph_vae_multiplex
  - wgcna_gene
scale_methods:
  - isograph_vae
  - isograph_cpu_latent
  - wgcna_gene
scenarios:
  idealized_switching:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.10, 0.25, 0.50, 0.75]
    noise_sd: [0.10, 0.25, 0.40]
    seed_count: 30
  unequal_isoform_abundance:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    abundance_imbalance: [1, 4, 10, 25]
    noise_sd: [0.20]
  non_switching_background:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.05, 0.10, 0.25, 0.50]
    noise_sd: [0.25]
  noise_stress:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    count_dispersion: [3, 7, 15, 30]
    noise_sd: [0.05, 0.10, 0.25, 0.50]
  feature_space_interactions:
    n_genes: [400]
    n_samples: [160]
    switching_fraction: [0.25]
    interaction_strength: [0.0, 0.5, 1.0, 2.0, 3.0]
    interaction_fraction: [0.25, 0.50, 0.75]
    noise_sd: [0.25]
  abundance_switch_mixed:
    n_genes: [200, 500]
    n_samples: [100, 200]
    switching_fraction: [0.25]
    abundance_fraction: [0.0, 0.3, 0.5, 0.7, 1.0]
    noise_sd: [0.25]
    seed_count: 20
  scale:
    n_genes: [1000, 3000, 6000, 12000]
    n_samples: [240]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
  scale_realistic:
    # BrainSEQ-scale validation: ~17k genes x 300 samples matches real data dimensions.
    # Separate from "scale" to preserve existing run hashes while adding the
    # larger point needed for Nature Methods reviewers.
    n_genes: [16000]
    n_samples: [300]
    switching_fraction: [0.15, 0.25]
    noise_sd: [0.25]
statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  paired_tests: true
  fdr_method: benjamini-hochberg
